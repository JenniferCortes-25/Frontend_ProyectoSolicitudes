<div class="container mt-4">

  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">
      <i class="pi pi-list-check me-2 text-primary"></i>Mis Solicitudes
    </h1>
    <a routerLink="/solicitudes/nueva" class="btn btn-primary">
      <i class="pi pi-plus me-1"></i>Nueva Solicitud
    </a>
  </div>

  @if (cargando()) {
    <div class="d-flex justify-content-center my-5">
      <p-progressSpinner strokeWidth="4" />
    </div>
  } @else {
    <p-table
      [value]="solicitudes()"
      [tableStyle]="{ 'min-width': '50rem' }"
      stripedRows>

      <ng-template #header>
        <tr>
          <th>Descripción</th>
          <th>Tipo</th>
          <th>Estado</th>
          <th>Prioridad</th>
          <th>Fecha</th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template #body let-s>
        <tr>
          <td>{{ s.descripcionBreve }}</td>
          <td>{{ s.tipo ?? '—' }}</td>
          <td>
            <p-tag [value]="s.estado"
                   [severity]="tagSeveridad(s.estado)" />
          </td>
          <td>
            <p-tag [value]="s.nivelPrioridad ?? 'Sin prioridad'"
                   [severity]="tagPrioridad(s.nivelPrioridad ?? '')"
                   icon="pi pi-arrow-up" />
          </td>
          <td>{{ s.fechaRegistro | slice:0:10 }}</td>
          <td>
            <a [routerLink]="['/solicitudes', s.id]"
               class="btn btn-sm btn-outline-primary">
              <i class="pi pi-eye me-1"></i>Ver
            </a>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="6" class="text-center py-4">
            <i class="pi pi-inbox" style="font-size: 2rem"></i>
            <p class="mt-2 text-muted">No hay solicitudes registradas.</p>
          </td>
        </tr>
      </ng-template>

    </p-table>

    <!-- Paginador del servidor -->
    <p-paginator
      [rows]="size()"
      [totalRecords]="totalElements()"
      [rowsPerPageOptions]="[5, 10, 20]"
      (onPageChange)="onPageChange($event)">
    </p-paginator>
  }

</div>
