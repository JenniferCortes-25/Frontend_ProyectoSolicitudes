<div class="container mt-4">

  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">
      <i class="pi pi-list-check me-2 text-primary"></i>Mis Solicitudes
    </h1>
    <a routerLink="/solicitudes/nueva" class="btn btn-primary">
      <i class="pi pi-plus me-1"></i>Nueva Solicitud
    </a>
  </div>

  <!-- Filtro por estado -->
  <div class="mb-4">
    <label class="form-label small text-muted">Filtrar por estado:</label>
    <select class="form-select form-select-sm w-auto"
            [value]="filtroEstado()"
            (change)="cambiarFiltro($any($event.target).value)">
      <option value="">Todos</option>
      @for (e of estados; track e) {
        <option [value]="e">{{ e }}</option>
      }
    </select>
  </div>

  <!-- Estado vacío -->
  @if (solicitudes().length === 0) {
    <div class="text-center py-5 text-muted">
      <i class="pi pi-inbox" style="font-size: 3rem"></i>
      <p class="h5 mt-3">No hay solicitudes registradas aún.</p>
      <a routerLink="/solicitudes/nueva" class="btn btn-outline-primary mt-2">
        Crear mi primera solicitud
      </a>
    </div>
  } @else {
    <div class="row g-3">
      @for (s of solicitudes(); track s.id) {
        <div class="col-md-6 col-lg-4">
          <p-card styleClass="h-100 solicitud-card"
                  [style]="(s.nivelPrioridad === 'ALTA' || s.nivelPrioridad === 'CRITICA') ? {'border-left': '4px solid #dc3545'} : {}">

            <!-- Header manual dentro del body del card -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="fw-semibold small text-truncate" style="max-width:65%">
                {{ s.descripcionBreve }}
              </span>
              <p-tag [value]="s.estado" [severity]="tagSeveridad(s.estado)" />
            </div>

            <!-- Contenido -->
            <p class="text-muted small mb-2">
              <i class="pi pi-tag me-1"></i>{{ s.tipo ?? '—' }}
            </p>
            <p class="text-muted small mb-3">
              <i class="pi pi-calendar me-1"></i>
              {{ s.fechaRegistro | slice:0:10 }}
            </p>

            <!-- Footer manual -->
            <div class="d-flex justify-content-between align-items-center">
              <p-tag [value]="s.nivelPrioridad ?? 'Sin prioridad'"
                     [severity]="tagPrioridad(s.nivelPrioridad ?? '')"
                     icon="pi pi-arrow-up" />
              <a [routerLink]="['/solicitudes', s.id]"
                 class="btn btn-sm btn-outline-primary">
                <i class="pi pi-eye me-1"></i>Ver
              </a>
            </div>

          </p-card>
        </div>
      }
    </div>
  }
</div>
