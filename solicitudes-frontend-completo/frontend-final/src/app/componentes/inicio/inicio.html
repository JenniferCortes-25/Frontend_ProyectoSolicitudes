<!-- inicio.ts: añade auth = inject(AuthService) -->

<div class="container mt-4">
  <h2 class="mb-4">Bienvenido al Sistema</h2>

  <div class="row g-3">

    @if (auth.estaAutenticado()) {
      <div class="col-md-4">
        <div class="card text-center p-3 h-100">
          <i class="fa-solid fa-list fa-2x text-primary mb-2"></i>
          <h5>Mis Solicitudes</h5>
          <a routerLink="/solicitudes" class="btn btn-outline-primary btn-sm mt-2">
            Ver
          </a>
        </div>
      </div>
    }

    @if (auth.isAdmin()) {
      <div class="col-md-4">
        <div class="card text-center p-3 h-100 border-danger">
          <i class="fa-solid fa-users fa-2x text-danger mb-2"></i>
          <h5>Gestión de Usuarios</h5>
          <a routerLink="/usuarios" class="btn btn-outline-danger btn-sm mt-2">
            Administrar
          </a>
        </div>
      </div>
    }

    @if (auth.isDocente()) {
      <div class="col-md-4">
        <div class="card text-center p-3 h-100" style="border-color:#F59E0B">
          <i class="fa-solid fa-chalkboard-user fa-2x mb-2" style="color:#D97706"></i>
          <h5>Solicitudes Asignadas</h5>
          <p class="small text-muted mb-2">Solicitudes pendientes de atención</p>
          <a routerLink="/solicitudes-asignadas" class="btn btn-sm mt-2" style="border-color:#F59E0B;color:#92400E">
            Atender
          </a>
        </div>
      </div>
    }

  </div>
</div>
