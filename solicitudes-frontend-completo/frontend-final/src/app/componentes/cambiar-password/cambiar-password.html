<div class="cp-wrapper">
  <div class="cp-card">
    <h2>🔑 Cambiar contraseña</h2>
    <p class="cp-desc">Por seguridad, cambia tu contraseña por defecto antes de continuar.</p>

    @if (error()) {
      <div class="alerta-error">⚠️ {{ error() }}</div>
    }
    @if (exito()) {
      <div class="alerta-exito">{{ exito() }}</div>
    }

    <div class="campo">
      <label>Contraseña actual *</label>
      <input type="password"
             [value]="passwordActual()"
             (input)="passwordActual.set($any($event.target).value)"
             placeholder="Tu contraseña actual" />
    </div>

    <div class="campo">
      <label>Nueva contraseña * <span class="hint">(mín. 8 caracteres)</span></label>
      <input type="password"
             [value]="passwordNueva()"
             (input)="passwordNueva.set($any($event.target).value)"
             placeholder="Nueva contraseña" />
    </div>

    <div class="campo">
      <label>Confirmar nueva contraseña *</label>
      <input type="password"
             [value]="passwordConf()"
             (input)="passwordConf.set($any($event.target).value)"
             placeholder="Repite la nueva contraseña" />
    </div>

    <button class="btn-cambiar" (click)="cambiar()" [disabled]="cargando()">
      @if (cargando()) { Actualizando… } @else { Actualizar contraseña }
    </button>
  </div>
</div>
