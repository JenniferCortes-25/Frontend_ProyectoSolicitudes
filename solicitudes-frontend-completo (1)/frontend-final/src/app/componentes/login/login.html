<div class="login-contenedor">
  <div class="login-card">
    <div class="login-icono">🔐</div>
    <h2>Iniciar Sesión</h2>
    <p class="subtitulo">Sistema de Solicitudes UniQ</p>

    @if (error()) {
      <div class="alerta-error">{{ error() }}</div>
    }

    <div class="campo">
      <label for="username">Usuario</label>
      <input id="username" type="text"
             [value]="username()"
             (input)="username.set($any($event.target).value)"
             placeholder="Tu identificación o email"
             autocomplete="username" />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password"
             [value]="password()"
             (input)="password.set($any($event.target).value)"
             placeholder="••••••••"
             autocomplete="current-password" />
    </div>

    <button class="btn-ingresar" (click)="iniciarSesion()" [disabled]="cargando()">
      @if (cargando()) { Ingresando… } @else { Ingresar }
    </button>

    <p class="pie">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </div>
</div>
